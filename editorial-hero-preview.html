<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Lifestyle Compositor – Editorial Hero Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        fontFamily: {
          serif: ['Instrument Serif', 'Georgia', 'serif'],
          sans: ['Inter', 'system-ui', 'sans-serif'],
        },
      },
    };
  </script>
  <style>
    body { margin: 0; background: #FAF9F6; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState } = React;

    const DATA = {
      title: "AI Lifestyle Compositor",
      headline: "Designing the human review system for an AI tool that generates realistic 3D lifestyle imagery for Amazon Devices, trained on proprietary device data.",
      company: "Amazon Devices",
      client: "Amazon Devices",
      role: "Lead UX Designer",
      timeline: "Dec 2024 – Mar 2025",
      collaborators: "1 PM, 2 ML Engineers, 1 Creative Director, 2 Engineers",
      status: "Launched",
      metrics: [
        { value: "3,000", label: "Market-ready lifestyle assets" },
        { value: "~10 hrs", label: "Human review for 12,000 variations" },
      ],
      deliverables: [
        "Human review system design",
        "Feedback taxonomy",
        "Sampling model",
        "Batch review interface",
        "Figma-to-code workflow",
        "Design system contribution",
      ],
      heroImage: "https://images.unsplash.com/photo-1620712943543-bcc4688e7485?auto=format&fit=crop&w=2000&q=80",
    };

    const EditorialHero = () => {
      const [imgLoaded, setImgLoaded] = useState(false);

      return (
        <div className="bg-[#FAF9F6] text-[#1A1A1A] min-h-screen font-sans selection:bg-[#E5E5E5]">

          <nav className="flex justify-between items-center px-6 py-8 md:px-12 lg:px-20 text-sm font-medium tracking-tight">
            <div className="font-semibold text-lg tracking-normal">Bruno Wong M.</div>
            <div className="hidden md:flex space-x-10 text-gray-400">
              <a href="#" className="text-[#1A1A1A] border-b border-[#1A1A1A] pb-1">Work</a>
              <a href="#" className="hover:text-[#1A1A1A] transition-colors">About</a>
              <a href="#" className="hover:text-[#1A1A1A] transition-colors">Resume</a>
            </div>
            <div>
              <a href="#" className="hover:text-gray-500 transition-colors">Contact</a>
            </div>
          </nav>

          <main className="px-6 md:px-12 lg:px-20 pt-16 md:pt-24 pb-16 max-w-[1800px] mx-auto">

            <div className="grid grid-cols-1 lg:grid-cols-12 gap-12 lg:gap-8 mb-16 md:mb-24">

              <div className="col-span-1 lg:col-span-8 flex flex-col justify-start">
                <div className="flex items-center space-x-4 mb-8">
                  <span className="w-8 h-[2px] bg-[#E3A89F]"></span>
                  <span className="text-[10px] font-bold tracking-[0.2em] uppercase text-gray-500">{DATA.company} · {DATA.status}</span>
                </div>

                <h1 className="text-4xl md:text-6xl lg:text-7xl font-serif leading-[1.1] tracking-tight text-[#1A1A1A] max-w-4xl mb-6">
                  {DATA.title}
                </h1>

                <p className="text-lg md:text-xl text-gray-500 font-light leading-relaxed max-w-2xl">
                  {DATA.headline}
                </p>
              </div>

              <div className="col-span-1 lg:col-span-4 flex flex-col sm:flex-row lg:flex-col justify-start gap-12 lg:pl-12 pt-4 lg:pt-0">

                <div>
                  <h3 className="text-xs font-bold text-[#1A1A1A] mb-5 tracking-wide">Deliverables</h3>
                  <ul className="text-[13px] text-gray-500 space-y-2.5 leading-relaxed">
                    {DATA.deliverables.map((d, i) => <li key={i}>{d}</li>)}
                  </ul>
                </div>

                <div className="space-y-6">
                  <div>
                    <h3 className="text-xs font-bold text-[#1A1A1A] mb-1.5 tracking-wide">Role</h3>
                    <p className="text-[13px] text-gray-500">{DATA.role}</p>
                  </div>
                  <div>
                    <h3 className="text-xs font-bold text-[#1A1A1A] mb-1.5 tracking-wide">Timeline</h3>
                    <p className="text-[13px] text-gray-500">{DATA.timeline}</p>
                  </div>
                  <div>
                    <h3 className="text-xs font-bold text-[#1A1A1A] mb-1.5 tracking-wide">Client</h3>
                    <p className="text-[13px] text-gray-500">{DATA.client}</p>
                  </div>
                </div>

              </div>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-10 max-w-2xl">
              {DATA.metrics.map((m, i) => (
                <div key={i} className="flex items-baseline gap-3">
                  <span className="text-4xl md:text-5xl font-serif text-[#1A1A1A] tabular-nums">{m.value}</span>
                  <span className="text-sm text-gray-500 leading-snug max-w-[160px]">{m.label}</span>
                </div>
              ))}
            </div>

            <div className="w-full relative bg-gray-100 overflow-hidden rounded-sm">
              <div className={`transition-opacity duration-700 ${imgLoaded ? 'opacity-100' : 'opacity-0'}`}>
                <img
                  src={DATA.heroImage}
                  alt="AI Lifestyle Compositor – Amazon Devices"
                  className="w-full h-auto object-cover aspect-[16/9] md:aspect-[21/9] transform transition-transform duration-[1.5s] ease-out hover:scale-[1.02]"
                  onLoad={() => setImgLoaded(true)}
                />
              </div>
              {!imgLoaded && (
                <div className="absolute inset-0 flex items-center justify-center bg-gray-200">
                  <div className="w-8 h-8 border-2 border-gray-300 border-t-gray-500 rounded-full animate-spin"></div>
                </div>
              )}
            </div>

          </main>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<EditorialHero />);
  </script>
</body>
</html>
